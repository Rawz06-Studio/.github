# Pipeline application Node (image Docker) — Rawz06-Studio
#
#   PR / branche          → lint, typecheck, test, build + image construite
#   PR avec label preview → image :preview publiée + déploiement preprod
#   push sur $default-branch → image :<version> + release + déploiement prod
#   Actions > Pipeline > Run workflow : release ou preview à la demande, bump forcé
#
# Le Dockerfile part de ghcr.io/rawz06-studio/node-runtime:24 (ou static-web pour un front)
# et copie les fichiers listés dans image-files.
# Secrets du repo : DOKPLOY_TOKEN (webhook de l'app de prod), DOKPLOY_PREVIEW_TOKEN
# (webhook de l'app de preprod, facultatif). Variable : DOKPLOY_URL (repo ou organisation).
#
name: Pipeline

on:
  push:
    branches: [$default-branch]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      mode:
        description: Ce que fait le run
        type: choice
        default: release
        options: [release, preview]
      bump:
        description: Niveau de version de la release
        type: choice
        default: auto
        options: [auto, patch, minor, major]

# Une seule release à la fois sur $default-branch ; une PR annule son run précédent.
concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  pipeline:
    uses: Rawz06-Studio/.github/.github/workflows/node-app.yml@v1
    permissions:
      contents: write
      packages: write
    with:
      image-name: mon-app
      dokploy-url: ${{ vars.DOKPLOY_URL }}
      # Nuxt : .output (défaut). Serveur Node :
      # image-files: |
      #   dist
      #   package.json
      #   node_modules
      # prod-dependencies: true
      # native-modules: true     # better-sqlite3, sharp…
    secrets: inherit
