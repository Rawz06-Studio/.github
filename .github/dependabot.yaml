version: 2
updates:
  # Actions utilisées par les workflows et par les actions composites de ce repo.
  - package-ecosystem: github-actions
    directories:
      - /
      - /actions/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    labels:
      - dependencies
      - github-actions

  # Les images de base (images/*) seront ajoutées ici à l'étape 2.
