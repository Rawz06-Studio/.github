version: 2
updates:
  # Actions utilisées par les workflows et par les actions composites de ce repo.
  - package-ecosystem: github-actions
    directories:
      - /
      - /actions/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    labels:
      - dependencies
      - github-actions

  # Images amont des images de base (FROM …). Les correctifs d'une même version
  # arrivent déjà par la reconstruction hebdomadaire ; Dependabot propose les montées de tag.
  - package-ecosystem: docker
    directories:
      - /images/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
