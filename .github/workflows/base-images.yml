name: Base images

# Construit les images de base déclarées dans images/images.json et les publie sur GHCR
# en multi-arch (amd64 + arm64), chaque architecture sur un runner natif.
#
# Tags publiés pour chaque image :
#   <tag>             mobile, utilisé par les projets          (ex. java-runtime:25)
#   <tag>-AAAA.MM.JJ  figé, pour revenir en arrière             (ex. java-runtime:25-2026.11.21)
#
# Pas de cache de build : la reconstruction hebdomadaire doit récupérer les correctifs
# de sécurité des paquets système, pas réutiliser d'anciennes couches.

on:
  push:
    branches: [main]
    paths:
      - images/**
      - .github/workflows/base-images.yml
  pull_request:
    paths:
      - images/**
      - .github/workflows/base-images.yml
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: base-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      images: ${{ steps.plan.outputs.images }}
      date: ${{ steps.plan.outputs.date }}
      registry: ${{ steps.plan.outputs.registry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read images.json
        id: plan
        run: |
          {
            echo "images=$(jq -c . images/images.json)"
            echo "date=$(date -u +%Y.%m.%d)"
            echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          } >>"$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    needs: plan
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ${{ needs.plan.outputs.registry }}/${{ matrix.image.name }}
      CONTEXT: images/${{ matrix.image.name }}
      PLATFORM: linux/${{ matrix.platform.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          platforms: ${{ env.PLATFORM }}
          pull: true
          load: true
          tags: local/${{ matrix.image.name }}:test
          provenance: false

      - name: Test
        env:
          NAME: ${{ matrix.image.name }}
        run: tests/base-images.sh "$NAME"

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          platforms: ${{ env.PLATFORM }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=${{ matrix.image.description }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false

      - name: Export digest
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image.name }}
    needs: [plan, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    env:
      IMAGE: ${{ needs.plan.outputs.registry }}/${{ matrix.image.name }}
      TAG: ${{ matrix.image.tag }}
      DATE: ${{ needs.plan.outputs.date }}
      DESCRIPTION: ${{ matrix.image.description }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.image.name }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          if [ "$TAG" = latest ]; then dated="$DATE"; else dated="$TAG-$DATE"; fi
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create \
            --tag "$IMAGE:$TAG" \
            --tag "$IMAGE:$dated" \
            --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "index:org.opencontainers.image.description=$DESCRIPTION" \
            "${sources[@]}"
          echo "- \`$IMAGE:$TAG\` et \`$IMAGE:$dated\`" >>"$GITHUB_STEP_SUMMARY"

      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:$TAG"
