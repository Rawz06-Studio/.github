name: Self-test

# Vérifie ce repo lui-même : lint des workflows, audit de sécurité, tests des scripts.
# Appelé par self-release.yml avant chaque release.

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions: {}

env:
  # Workflows historiques, appelés en @main par les projets non migrés.
  # Exclus du lint jusqu'à leur suppression (voir ARCHITECTURE.md §11).
  LEGACY_WORKFLOWS: docker-build-push.yml maven-ci.yml maven-ci-preprod.yml maven-ci-release.yml maven-ci-snapshot.yml node-ci.yml node-ci-preprod.yml node-ci-release.yml

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflows
        run: |
          files=()
          for f in .github/workflows/*.yml; do
            case " $LEGACY_WORKFLOWS " in *" $(basename "$f") "*) continue ;; esac
            files+=("$f")
          done
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color "${files[@]}"

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows and actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(actions)
          for f in .github/workflows/*.yml; do
            case " $LEGACY_WORKFLOWS " in *" $(basename "$f") "*) continue ;; esac
            files+=("$f")
          done
          pipx run zizmor --config .github/zizmor.yml --format=github "${files[@]}"

  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Dockerfiles
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo hadolint/hadolint:v2.12.0-debian \
            hadolint --config .hadolint.yaml --format tty images/*/Dockerfile

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        run: find actions tests -name '*.sh' -print0 | xargs -0 shellcheck

      - name: compute-version
        run: tests/compute-version.sh

      - name: set-version
        run: tests/set-version.sh

      - name: dokploy-deploy
        run: tests/dokploy-deploy.sh

      - name: prepare-image-context
        run: tests/prepare-image-context.sh

  # Les actions setup-* sur de vrais mini-projets : installation, cache, build versionné.
  setup-java:
    name: setup-java
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        id: java
        uses: ./actions/setup-java
        with:
          working-directory: tests/fixtures/maven

      - name: Build fixture
        env:
          MVN: ${{ steps.java.outputs.mvn }}
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ github.token }}
        run: tests/fixtures.sh maven

  setup-node:
    name: setup-node
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: ./actions/setup-node
        with:
          working-directory: tests/fixtures/node

      - name: Build fixture
        run: tests/fixtures.sh node

      - name: set-version (action)
        id: set
        uses: ./actions/set-version
        with:
          version: v9.9.9
          working-directory: tests/fixtures/node

      - name: Check action output
        env:
          STACKS: ${{ steps.set.outputs.stacks }}
        run: |
          test "$STACKS" = node
          grep -q '"version": "9.9.9"' tests/fixtures/node/package.json

  setup-php:
    name: setup-php
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: ./actions/setup-php
        with:
          working-directory: tests/fixtures/php

      - name: Build fixture
        run: tests/fixtures.sh php

  setup-rust:
    name: setup-rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./actions/setup-rust
        with:
          targets: x86_64-unknown-linux-musl
          working-directory: tests/fixtures/rust

      - name: Build fixture (dont binaire statique musl)
        env:
          RUST_TARGET: x86_64-unknown-linux-musl
        run: tests/fixtures.sh rust

  # Bout en bout : les jobs réutilisables appelés comme le feront les pipelines,
  # avec les actions de ce commit (tooling-ref) et sans rien publier.
  e2e-version:
    name: e2e / version
    uses: ./.github/workflows/_version.yml
    permissions:
      contents: read
    with:
      mode: ci
      working-directory: tests/fixtures/node
      tooling-ref: ${{ github.sha }}

  e2e-java:
    name: e2e / java
    needs: e2e-version
    uses: ./.github/workflows/_java.yml
    permissions:
      contents: read
      packages: read
    with:
      version: ${{ needs.e2e-version.outputs.version }}
      working-directory: tests/fixtures/maven
      image: true
      artifact-name: image-context-java
      tooling-ref: ${{ github.sha }}

  e2e-java-image:
    name: e2e / java image
    needs: [e2e-version, e2e-java]
    uses: ./.github/workflows/_docker.yml
    permissions:
      contents: read
    with:
      image-name: fixture-java
      version: ${{ needs.e2e-version.outputs.version }}
      mode: ci
      context-artifact: image-context-java
      test-expect: fixture ${{ needs.e2e-version.outputs.version }}

  e2e-node:
    name: e2e / node
    needs: e2e-version
    uses: ./.github/workflows/_node.yml
    permissions:
      contents: read
      packages: read
    with:
      version: ${{ needs.e2e-version.outputs.version }}
      working-directory: tests/fixtures/node
      image: true
      image-files: dist
      artifact-name: image-context-node
      tooling-ref: ${{ github.sha }}

  e2e-node-image:
    name: e2e / node image
    needs: [e2e-version, e2e-node]
    uses: ./.github/workflows/_docker.yml
    permissions:
      contents: read
    with:
      image-name: fixture-node
      version: ${{ needs.e2e-version.outputs.version }}
      mode: ci
      context-artifact: image-context-node
      test-expect: ${{ needs.e2e-version.outputs.version }}

  e2e-php:
    name: e2e / php
    needs: e2e-version
    uses: ./.github/workflows/_php.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.e2e-version.outputs.version }}
      working-directory: tests/fixtures/php
      image: true
      artifact-name: image-context-php
      tooling-ref: ${{ github.sha }}

  e2e-php-image:
    name: e2e / php image
    needs: [e2e-version, e2e-php]
    uses: ./.github/workflows/_docker.yml
    permissions:
      contents: read
    with:
      image-name: fixture-php
      version: ${{ needs.e2e-version.outputs.version }}
      mode: ci
      context-artifact: image-context-php
      test-expect: fixture ${{ needs.e2e-version.outputs.version }}

  e2e-rust:
    name: e2e / rust
    needs: e2e-version
    uses: ./.github/workflows/_rust.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.e2e-version.outputs.version }}
      working-directory: tests/fixtures/rust
      image: true
      binaries: fixture
      artifact-name: image-context-rust
      tooling-ref: ${{ github.sha }}

  e2e-rust-image:
    name: e2e / rust image
    needs: [e2e-version, e2e-rust]
    uses: ./.github/workflows/_docker.yml
    permissions:
      contents: read
    with:
      image-name: fixture-rust
      version: ${{ needs.e2e-version.outputs.version }}
      mode: ci
      context-artifact: image-context-rust
      test-expect: fixture ${{ needs.e2e-version.outputs.version }}

  e2e-rust-binaries:
    name: e2e / rust binaries
    needs: e2e-version
    uses: ./.github/workflows/_rust-binaries.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.e2e-version.outputs.version }}
      binary: fixture
      working-directory: tests/fixtures/rust
      version-check: true
      targets: '[{"name": "linux-x86_64", "runner": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu"}]'
      tooling-ref: ${{ github.sha }}

  e2e-docker-from-repo:
    name: e2e / docker from repo
    needs: e2e-version
    uses: ./.github/workflows/_docker.yml
    permissions:
      contents: read
    with:
      image-name: fixture-docker
      version: ${{ needs.e2e-version.outputs.version }}
      mode: ci
      context-artifact: ""
      working-directory: tests/fixtures/docker
      test-expect: fixture ${{ needs.e2e-version.outputs.version }}
