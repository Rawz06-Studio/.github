name: Self-release

# Chaque push sur main publie une version de ce repo : tag vX.Y.Z + GitHub Release,
# puis déplace le tag majeur (v1, v2…) que les projets utilisent.
# Tant que la version est en 0.x, aucun tag majeur n'est posé.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      bump:
        description: Niveau de version
        type: choice
        default: auto
        options: [auto, patch, minor, major]

permissions: {}

concurrency:
  group: self-release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/self-test.yml
    # self-test appelle les pipelines, dont les jobs de publication déclarent ces
    # permissions ; ils tournent en mode ci et ne publient rien.
    permissions:
      contents: write
      packages: write

  release:
    name: Release
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute version
        id: version
        uses: ./actions/compute-version
        with:
          bump: ${{ inputs.bump || 'auto' }}
          initial-version: 0.1.0

      - name: Create GitHub release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous-tag }}
        run: |
          args=(--target "$GITHUB_SHA" --title "$TAG" --generate-notes)
          if [ -n "$PREVIOUS_TAG" ]; then
            args+=(--notes-start-tag "$PREVIOUS_TAG")
          fi
          gh release create "$TAG" "${args[@]}"

      - name: Move major tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          major="${VERSION%%.*}"
          if [ "$major" -lt 1 ]; then
            echo "Version $VERSION : pas de tag majeur avant la 1.0.0"
            exit 0
          fi
          ref="tags/v$major"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/$ref" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/$ref" -f sha="$GITHUB_SHA" -F force=true
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/$ref" -f sha="$GITHUB_SHA"
          fi
          echo "v$major -> $GITHUB_SHA" >>"$GITHUB_STEP_SUMMARY"
