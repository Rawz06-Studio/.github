name: java-app

# Pipeline d'une application Java (Spring Boot…) livrée en image Docker.
#
#   PR / branche      version ci      → mvn verify → image construite (et testée), non publiée
#   PR label preview  version rc      → mvn verify → image :preview publiée → déploiement preprod
#   push main         version release → mvn verify → image :<version> :latest → tag + Release → prod
#
# Modèle d'appel : workflow-templates/java-app.yml. Permissions à accorder :
# contents: write, packages: write (chaque job n'utilise que ce dont il a besoin).

on:
  workflow_call:
    inputs:
      image-name:
        description: Nom de l'image (ghcr.io/<org>/<image-name>)
        type: string
        required: true
      java-version:
        type: string
        default: "25"
      working-directory:
        type: string
        default: .
      jar:
        description: Jar à embarquer (vide = l'unique jar exécutable de target/)
        type: string
        default: ""
      image-files:
        description: Fichiers supplémentaires pour l'image, un par ligne
        type: string
        default: ""
      dockerfile:
        type: string
        default: Dockerfile
      platforms:
        type: string
        default: linux/amd64
      test-command:
        description: Arguments de `docker run` pour tester l'image avant publication
        type: string
        default: ""
      test-expect:
        description: Texte attendu dans la sortie du test
        type: string
        default: ""
      dokploy-url:
        description: URL Dokploy (passer vars.DOKPLOY_URL)
        type: string
        default: ""
      application-id:
        description: Application Dokploy de prod, si déploiement par API (secret DOKPLOY_API_KEY)
        type: string
        default: ""
      preview-application-id:
        description: Application Dokploy de preprod, si déploiement par API
        type: string
        default: ""
      mode:
        description: "auto (déduit de l'événement) | release | preview | ci"
        type: string
        default: auto
      initial-version:
        description: Version de la toute première release (vide = lue dans le pom)
        type: string
        default: ""
      tooling-ref:
        description: Ref de Rawz06-Studio/.github pour les actions
        type: string
        default: v1
    secrets:
      DOKPLOY_TOKEN:
        description: Jeton du webhook de l'app de prod
        required: false
      DOKPLOY_PREVIEW_TOKEN:
        description: Jeton du webhook de l'app de preprod
        required: false
      DOKPLOY_API_KEY:
        description: Clé d'API Dokploy, à la place des webhooks
        required: false
    outputs:
      mode:
        value: ${{ jobs.version.outputs.mode }}
      version:
        value: ${{ jobs.version.outputs.version }}

permissions: {}

jobs:
  version:
    uses: ./.github/workflows/_version.yml
    permissions:
      contents: read
    with:
      mode: ${{ inputs.mode }}
      initial-version: ${{ inputs.initial-version }}
      working-directory: ${{ inputs.working-directory }}
      tooling-ref: ${{ inputs.tooling-ref }}

  build:
    needs: version
    uses: ./.github/workflows/_java.yml
    permissions:
      contents: read
      packages: read
    with:
      version: ${{ needs.version.outputs.version }}
      java-version: ${{ inputs.java-version }}
      working-directory: ${{ inputs.working-directory }}
      image: true
      jar: ${{ inputs.jar }}
      image-files: ${{ inputs.image-files }}
      dockerfile: ${{ inputs.dockerfile }}
      tooling-ref: ${{ inputs.tooling-ref }}

  image-check:
    needs: [version, build]
    if: needs.version.outputs.mode == 'ci'
    uses: ./.github/workflows/_docker.yml
    permissions:
      contents: read
    with:
      image-name: ${{ inputs.image-name }}
      version: ${{ needs.version.outputs.version }}
      mode: ci
      platforms: ${{ inputs.platforms }}
      test-command: ${{ inputs.test-command }}
      test-expect: ${{ inputs.test-expect }}

  image:
    needs: [version, build]
    if: needs.version.outputs.mode != 'ci'
    uses: ./.github/workflows/_docker.yml
    permissions:
      contents: read
      packages: write
    with:
      image-name: ${{ inputs.image-name }}
      version: ${{ needs.version.outputs.version }}
      mode: ${{ needs.version.outputs.mode }}
      push: true
      platforms: ${{ inputs.platforms }}
      test-command: ${{ inputs.test-command }}
      test-expect: ${{ inputs.test-expect }}
      pr-number: ${{ needs.version.outputs.pr-number }}

  release:
    needs: [version, image]
    if: needs.version.outputs.mode == 'release'
    uses: ./.github/workflows/_release.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.version.outputs.tag }}
      previous-tag: ${{ needs.version.outputs.previous-tag }}

  deploy:
    needs: [version, release]
    if: needs.version.outputs.mode == 'release'
    uses: ./.github/workflows/_deploy.yml
    permissions:
      contents: read
    with:
      environment: production
      url: ${{ inputs.dokploy-url }}
      application-id: ${{ inputs.application-id }}
      tooling-ref: ${{ inputs.tooling-ref }}
    secrets:
      webhook-token: ${{ secrets.DOKPLOY_TOKEN }}
      api-key: ${{ inputs.application-id != '' && secrets.DOKPLOY_API_KEY || '' }}

  deploy-preview:
    needs: [version, image]
    if: needs.version.outputs.mode == 'preview'
    uses: ./.github/workflows/_deploy.yml
    permissions:
      contents: read
    with:
      environment: preview
      url: ${{ inputs.dokploy-url }}
      application-id: ${{ inputs.preview-application-id }}
      tooling-ref: ${{ inputs.tooling-ref }}
    secrets:
      webhook-token: ${{ secrets.DOKPLOY_PREVIEW_TOKEN }}
      api-key: ${{ inputs.preview-application-id != '' && secrets.DOKPLOY_API_KEY || '' }}
