name: Dokploy deploy
description: >-
  Déclenche le déploiement d'une application Dokploy, soit par son webhook
  (jeton secret), soit par l'API (clé d'API + identifiant d'application).

inputs:
  url:
    description: URL de l'instance Dokploy (ex. https://dokploy.example.com)
    required: true
  webhook-token:
    description: Jeton du webhook de déploiement de l'application (secret)
    required: false
    default: ""
  api-key:
    description: Clé d'API Dokploy (secret), à la place du webhook
    required: false
    default: ""
  application-id:
    description: Identifiant de l'application, avec api-key
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Deploy
      shell: bash
      env:
        DOKPLOY_URL: ${{ inputs.url }}
        DOKPLOY_WEBHOOK_TOKEN: ${{ inputs.webhook-token }}
        DOKPLOY_API_KEY: ${{ inputs.api-key }}
        DOKPLOY_APPLICATION_ID: ${{ inputs.application-id }}
      run: "${GITHUB_ACTION_PATH}/deploy.sh"
