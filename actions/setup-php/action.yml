name: Setup PHP
description: >-
  Installe PHP avec les mêmes extensions que l'image php-runtime, Composer, met en
  cache les paquets Composer et installe les dépendances.

inputs:
  php-version:
    description: Version de PHP
    required: false
    default: "8.4"
  extensions:
    description: Extensions PHP (mêmes que php-runtime par défaut)
    required: false
    default: intl, opcache, pdo_pgsql, pgsql, zip
  working-directory:
    description: Dossier du projet (contient composer.json)
    required: false
    default: .
  install:
    description: Lancer `composer install`
    required: false
    default: "true"
  no-dev:
    description: Installer sans les dépendances de développement (pour l'image)
    required: false
    default: "false"

outputs:
  php-version:
    description: Version de PHP installée
    value: ${{ steps.php.outputs.php-version }}

runs:
  using: composite
  steps:
    - name: Set up PHP
      id: php
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: ${{ inputs.php-version }}
        extensions: ${{ inputs.extensions }}
        tools: composer
        coverage: none

    - name: Locate Composer cache
      id: composer
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >>"$GITHUB_OUTPUT"

    - name: Cache Composer packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.composer.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles(format('{0}/composer.lock', inputs.working-directory)) }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        NO_DEV: ${{ inputs.no-dev }}
      run: |
        args=(--no-interaction --no-progress --prefer-dist --optimize-autoloader)
        [ "$NO_DEV" = true ] && args+=(--no-dev)
        composer install "${args[@]}"
