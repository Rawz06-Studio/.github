; Réglages Rawz06-Studio, appliqués après php.ini-production.
date.timezone = Europe/Paris
expose_php = Off
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 20M

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Le code ne change pas dans une image : inutile de vérifier les fichiers.
opcache.validate_timestamps = 0
